<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.nav != "about" and page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script>
    // set theme before paint to avoid flash
    (function(){var t=localStorage.getItem("jv-theme")||((window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light");document.documentElement.setAttribute("data-theme",t);})();
  </script>
</head>
<body>
<div class="wrap">

  <header class="site-head">
    <div class="head-top">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="prompt">~/</span>jakub_vrabel</a>
      <button class="theme-toggle" type="button">◐ dark</button>
    </div>
    <nav class="menu">
      <a href="{{ '/' | relative_url }}"{% if page.nav == "about" %} class="active"{% endif %}>about</a>
      <a href="{{ '/events/' | relative_url }}"{% if page.nav == "events" %} class="active"{% endif %}>events</a>
      <a href="{{ '/teaching/' | relative_url }}"{% if page.nav == "teaching" %} class="active"{% endif %}>teaching</a>
      <a href="{{ '/cv/' | relative_url }}"{% if page.nav == "cv" %} class="active"{% endif %}>cv</a>
      <a href="https://scholar.google.com/citations?user=MCnlDZUAAAAJ&hl" target="_blank" rel="noopener">publications ↗</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-foot">
    <span>Jakub Vrabel · Brno, Czech Republic</span>
    <a href="https://scholar.google.com/citations?user=MCnlDZUAAAAJ&hl" target="_blank" rel="noopener">Scholar</a>
    <a href="https://github.com/jvrabel" target="_blank" rel="noopener">GitHub</a>
    <a href="https://www.linkedin.com/in/jakub-vrabel" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://twitter.com/VrabelJakub" target="_blank" rel="noopener">Twitter</a>
  </footer>

</div>
<script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</body>
</html>
